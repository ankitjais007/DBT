snapshots:
  - name: gold_items
    description: "This snapshot captures the state of the items table over time."
    relation: ref('source_gold_items')  # Reference to the source model for items
    config:
      schema: gold
      database: dbt_tutorial_dev
      unique_key: id
      strategy: timestamp
      updated_at: updateDate
      dbt_valid_to_current: "to_date('9999-12-31')" # Specifies that current records should have `dbt_valid_to` set to `'9999-12-31'` instead of `NULL`.